<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prisão — Visualizador</title>
  <style>
    :root {
      --bg: #121315;
      --panel: rgba(20, 21, 24, 0.9);
      --text: #e6e4df;
      --muted: #9a978f;
      --accent: #d8d2c4;
      --line: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; top: 12px; left: 12px; width: min(330px, calc(100vw - 24px)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    #hud h1 { font-size: 15px; margin: 0 0 2px; }
    #hud p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    button { background: #25272c; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font: inherit; font-size: 12px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    button.on { background: var(--accent); color: #151515; border-color: var(--accent); }
    #stats { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
    #walkhint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-size: 12px; display: none; }
    #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; opacity: 0.7; display: none; pointer-events: none; }
    #toggle { display: none; }
    @media (max-width: 560px) {
      #hud { top: 8px; left: 8px; padding: 10px; }
      #hud.collapsed .body { display: none; }
      #toggle { display: inline-block; float: right; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="cross"></div>
  <div id="hud">
    <button id="toggle" aria-label="Mostrar/ocultar painel">☰</button>
    <h1>Prisão</h1>
    <p>Part clássico · Plastic + Neon · cores neutras · ambiente fechado</p>
    <div class="body">
      <div class="row" id="views"></div>
      <div class="row">
        <button id="cut">Corte (sem teto)</button>
        <button id="walk">Andar (WASD)</button>
      </div>
      <div id="stats"></div>
    </div>
  </div>
  <div id="walkhint">WASD mover · Espaço pular · Shift correr · Esc sair</div>
  <script type="module" src="viewer/main.js"></script>
</body>
</html>
