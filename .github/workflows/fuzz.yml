# Fuzz de mapas: testa muitas sementes do gerador (createWorld) em fatias paralelas.
#   plan     -> divide [first, first + total) em fatias
#   fuzz     -> cada fatia roda tools/fuzz.mjs (camada barata em todas, Parts a cada full_every)
#   summary  -> junta os resultados (tools/ci/fuzz-summary.mjs) no resumo do Actions
# O fuzz rápido (26 sementes) roda em todo PR, em tests/invariants.test.mjs. Veja docs/FUZZ.md.
name: Fuzz de mapas (100 mil sementes)

on:
  workflow_dispatch:
    inputs:
      total:
        description: Quantas sementes testar
        type: number
        default: 100000
      shards:
        description: Em quantos jobs paralelos dividir (1 a 256)
        type: number
        default: 40
      full_every:
        description: Construção completa (Parts) nas sementes múltiplas de k (0 = nunca)
        type: number
        default: 2000
      first:
        description: Primeira semente (para reproduzir uma semente, use total 1 e full_every 1)
        type: number
        default: 1
  schedule:
    - cron: '17 4 * * 1' # toda segunda-feira

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  plan:
    name: Dividir as sementes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      per: ${{ steps.plan.outputs.per }}
      total: ${{ steps.plan.outputs.total }}
      first: ${{ steps.plan.outputs.first }}
      full_every: ${{ steps.plan.outputs.full_every }}
    steps:
      - name: Calcular as fatias
        id: plan
        env:
          TOTAL: ${{ inputs.total || 100000 }}
          SHARDS: ${{ inputs.shards || 40 }}
          # format(): 0 (nunca) vira '0', que não cai no padrão como o número 0 cairia
          FULL_EVERY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.full_every) || '2000' }}
          FIRST: ${{ inputs.first || 1 }}
        run: |
          set -euo pipefail
          for v in TOTAL SHARDS FULL_EVERY FIRST; do
            if ! [[ "${!v}" =~ ^[0-9]+$ ]]; then echo "::error::$v precisa ser inteiro (recebido: ${!v})"; exit 1; fi
          done
          if (( TOTAL < 1 || FIRST < 1 )); then echo "::error::total e first precisam ser >= 1"; exit 1; fi
          if (( SHARDS < 1 || SHARDS > 256 )); then echo "::error::shards precisa estar entre 1 e 256"; exit 1; fi
          PER=$(( (TOTAL + SHARDS - 1) / SHARDS ))
          SHARDS=$(( (TOTAL + PER - 1) / PER ))
          {
            echo "shards=[$(seq -s, 0 $(( SHARDS - 1 )))]"
            echo "per=$PER"
            echo "total=$TOTAL"
            echo "first=$FIRST"
            echo "full_every=$FULL_EVERY"
          } >> "$GITHUB_OUTPUT"
          echo "### Fuzz: $TOTAL sementes a partir da $FIRST, $SHARDS fatias de até $PER" >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fatia ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Testar as sementes da fatia
        env:
          SHARD: ${{ matrix.shard }}
          PER: ${{ needs.plan.outputs.per }}
          TOTAL: ${{ needs.plan.outputs.total }}
          FIRST: ${{ needs.plan.outputs.first }}
          FULL_EVERY: ${{ needs.plan.outputs.full_every }}
        run: |
          set -euo pipefail
          OFFSET=$(( SHARD * PER ))
          LEFT=$(( TOTAL - OFFSET ))
          COUNT=$(( LEFT < PER ? LEFT : PER ))
          FROM=$(( FIRST + OFFSET ))
          echo "Fatia $SHARD: sementes $FROM a $(( FROM + COUNT - 1 ))"
          node tools/fuzz.mjs --from "$FROM" --count "$COUNT" --full-every "$FULL_EVERY" --out out/fuzz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-${{ matrix.shard }}
          path: out/fuzz
          retention-days: 14
          if-no-files-found: warn

  summary:
    name: Resumo do fuzz
    needs: [plan, fuzz]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fuzz-*
          path: out/fuzz-results
      - name: Juntar os resultados
        env:
          EXPECTED_TOTAL: ${{ needs.plan.outputs.total }}
          FIRST_SEED: ${{ needs.plan.outputs.first }}
        run: |
          node tools/ci/fuzz-summary.mjs out/fuzz-results fuzz-summary.md
          cat fuzz-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resumo-do-fuzz
          path: fuzz-summary.md
          retention-days: 30
